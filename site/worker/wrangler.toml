# AskMe proxy. Deploy from this folder:
#   npx wrangler login
#   npx wrangler secret put GROQ_API_KEY
#   npx wrangler deploy
name = "askme"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
CONTEXT_URL = "https://vittoriols.github.io/newAI-Portfolio/askme/context.json"
ALLOWED_ORIGINS = "https://vittoriols.github.io,http://localhost:4321"
# Groq retires models: if AskMe reports "model_not_found", pick another one
# from https://console.groq.com/docs/models and run "npx wrangler deploy".
MODEL = "openai/gpt-oss-120b"
